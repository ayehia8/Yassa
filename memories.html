<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Memories — For Ela ♡</title>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@200;300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    /* ── PAGE-SPECIFIC STYLES ── */
    .mem-hero {
      min-height: 60svh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 4rem 1.5rem; position: relative; z-index: 1;
    }
    .mem-hero h1 {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(3.5rem, 12vw, 8rem); color: var(--blush);
      line-height: 1.2;
      text-shadow: 0 0 60px rgba(192,65,90,.6);
      opacity: 0; animation: fu 1.2s .3s forwards;
    }
    .mem-hero p {
      font-style: italic; color: var(--soft); font-size: clamp(.9rem, 2vw, 1.15rem);
      margin-top: 1rem; opacity: 0; animation: fu .9s .8s forwards; max-width: 500px;
    }

    .timeline { position: relative; max-width: 800px; margin: 0 auto; padding: 3rem 1.5rem; z-index: 1; }
    .timeline::before {
      content: ''; position: absolute; left: 50%; top: 0; bottom: 0;
      width: 1px; background: linear-gradient(to bottom, var(--rose), var(--gold), var(--rose), transparent);
      transform: translateX(-50%);
    }
    .tl-item {
      display: flex; gap: 2rem; margin-bottom: 3.5rem;
      position: relative; align-items: flex-start;
    }
    .tl-item:nth-child(odd) { flex-direction: row-reverse; text-align: right; }
    .tl-item:nth-child(odd) .tl-content { align-items: flex-end; }
    .tl-dot {
      position: absolute; left: 50%; top: .5rem;
      width: 2.2rem; height: 2.2rem; border-radius: 50%;
      background: rgba(192,65,90,.15); border: 1px solid var(--rose);
      display: flex; align-items: center; justify-content: center;
      transform: translateX(-50%); font-size: .9rem; z-index: 2;
      transition: transform .3s, box-shadow .3s;
    }
    .tl-item:hover .tl-dot {
      transform: translateX(-50%) scale(1.3);
      box-shadow: 0 0 25px rgba(192,65,90,.5);
    }
    .tl-content {
      flex: 1; display: flex; flex-direction: column; max-width: calc(50% - 2.5rem);
    }
    .tl-date {
      font-family: 'Josefin Sans', sans-serif; font-weight: 100;
      letter-spacing: .3em; font-size: .65rem; color: var(--gold);
      text-transform: uppercase; margin-bottom: .5rem;
    }
    .tl-title {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(1.3rem, 3vw, 1.8rem); color: var(--blush); margin-bottom: .5rem; line-height: 1.4;
    }
    .tl-text { font-size: .95rem; color: #ddc0c8; line-height: 1.8; }

    .image-timeline {
      max-width: 1080px;
      padding-top: 4rem;
    }
    .memory-shot {
      position: relative; width: 50%; margin: 0 0 2.4rem; display: flex;
    }
    .memory-shot:nth-child(odd) { justify-content: flex-end; padding-right: 2.4rem; }
    .memory-shot:nth-child(even) { justify-content: flex-start; margin-left: 50%; padding-left: 2.4rem; }
    .memory-shot::before {
      content: ''; position: absolute; top: 50%; width: .82rem; height: .82rem;
      border-radius: 50%; background: var(--blush); box-shadow: 0 0 22px rgba(192,65,90,.9);
      transform: translateY(-50%); z-index: 2;
    }
    .memory-shot:nth-child(odd)::before { right: -.41rem; }
    .memory-shot:nth-child(even)::before { left: -.41rem; }
    .memory-shot img {
      width: min(100%, 420px); max-height: 560px; display: block; object-fit: cover;
      border-radius: 24px; border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 24px 80px rgba(0,0,0,.34), 0 0 32px rgba(192,65,90,.12);
      transition: transform .55s ease, filter .55s ease, box-shadow .55s ease;
    }
    .memory-shot:hover img {
      transform: scale(1.035); filter: brightness(1.07);
      box-shadow: 0 30px 95px rgba(0,0,0,.4), 0 0 44px rgba(216,181,111,.14);
    }

    .memory-gallery {
      position: relative; z-index: 1; max-width: 1100px; margin: 0 auto;
      padding: 2rem clamp(1rem, 4vw, 3rem) 4rem; text-align: center;
    }
    .memory-gallery h2 {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(2.8rem, 8vw, 5.5rem); color: var(--blush);
      line-height: 1.25; margin-bottom: 2rem;
      text-shadow: 0 0 46px rgba(192,65,90,.44);
    }
    .memory-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr));
      gap: 1.2rem;
    }
    .memory-photo {
      position: relative; overflow: hidden; border-radius: 22px; margin: 0;
      aspect-ratio: 4 / 5; background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.14); box-shadow: 0 22px 70px rgba(0,0,0,.26);
    }
    .memory-photo img {
      width: 100%; height: 100%; display: block; object-fit: cover;
      transition: transform .55s ease, filter .55s ease;
    }
    .memory-photo:hover img { transform: scale(1.06); filter: brightness(1.08); }
    .memory-photo figcaption {
      position: absolute; left: .85rem; top: .75rem;
      font-family: 'Pinyon Script', cursive; font-size: 2.2rem; line-height: 1;
      color: var(--blush); text-shadow: 0 0 20px rgba(192,65,90,.85);
      pointer-events: none;
    }

    .back-link {
      display: block; text-align: center; margin: 3rem auto;
      font-family: 'Josefin Sans', sans-serif; font-weight: 100;
      letter-spacing: .3em; font-size: .7rem; color: var(--muted);
      text-transform: uppercase; text-decoration: none;
      padding: .8rem 2rem; border: 1px solid rgba(192,65,90,.2);
      border-radius: 4px; transition: all .3s; position: relative; z-index: 1;
      width: fit-content;
    }
    .back-link:hover { border-color: var(--rose); color: var(--rose); background: rgba(192,65,90,.08); }

    @media (max-width: 600px) {
      .timeline::before { left: 1.1rem; }
      .tl-item, .tl-item:nth-child(odd) { flex-direction: column; text-align: left; }
      .tl-item:nth-child(odd) .tl-content { align-items: flex-start; }
      .tl-dot { left: 1.1rem; }
      .tl-content { max-width: 100%; padding-left: 3rem; }
      .memory-grid { grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); }
      .image-timeline::before { left: 1.1rem; }
      .memory-shot,
      .memory-shot:nth-child(even),
      .memory-shot:nth-child(odd) {
        width: 100%; margin-left: 0; padding-left: 3rem; padding-right: 0; justify-content: flex-start;
      }
      .memory-shot:nth-child(odd)::before,
      .memory-shot:nth-child(even)::before { left: .69rem; right: auto; }
      .memory-shot img { width: 100%; max-height: none; }
    }
  </style>
</head>
<body class="page-ready">

<script>
  initHeartCursor();
  initFireworks();
  initStarfield();
  initFloatingHearts();
  initProgressBar();

  // Scroll reveal
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } });
  }, { threshold: .07 });
  document.querySelectorAll('.rev').forEach(el => io.observe(el));

  // Animated dividers
  const divObs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('animate'); divObs.unobserve(e.target); } });
  }, { threshold: .5 });
  document.querySelectorAll('.gline-animated').forEach(d => divObs.observe(d));
</script>
